<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brian's Login</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <!--Navigation Links-->
    <section class="nav">
      <nav class="nav-links">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="hobby.html">Hobbies</a></li>
          <li><a href="activity.html">Activities</a></li>
          <li><a href="goal.html">Goals</a></li>
        </ul>
      </nav>
    </section>

    <!--Login section-->
    <section class="login-part">
      <div class="login-card">
        <div class="user-icon">
          <img src="../video/boynew.gif" alt="headshot of a boy" />
        </div>
        <h1>Welcome</h1>
        <p class="welcome-text">Please Log In to continue to Brian's website</p>

        <!--form-->
        <form>
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter your username" />

          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
          />

          <!--remember and forgot part-->
          <div class="login-option">
            <label class="remember"><input type="checkbox" />Remember Me</label>
            <a href="#">Forgot Password?</a>
          </div>

          <!--button login-->
          <button type="submit">Log In</button>
        </form>

        <!--sign up-->
        <p class="signup">Don't have an account?<a href="#">Sign up here</a></p>
      </div>
    </section>

    <hr class="lineuse" />

    <!--footer-->
    <footer>
      <h1>Thank You for Visiting!</h1>
      <p>Made by Brian &copy;2026</p>
    </footer>
  </body>
</html>
